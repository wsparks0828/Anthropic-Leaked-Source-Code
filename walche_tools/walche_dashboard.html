<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WALCHE — Operator Console</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#060810;color:#e6e8eb;}
button{font-family:inherit;cursor:pointer;border:0;background:none;}

/* ── Space background ─────────────────────────────────────────────────────── */
#bg{position:fixed;inset:0;z-index:0;}
#bg canvas{display:block;width:100%;height:100%;}

/* ── Universe SVG ─────────────────────────────────────────────────────────── */
#universe{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;}
#universe .node-group{pointer-events:all;cursor:pointer;}
#universe .node-group:focus{outline:none;}

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:16px;
  padding:10px 20px;
  background:rgba(6,8,16,0.72);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(32,164,175,0.2);
}
.brand{display:flex;align-items:center;gap:10px;color:#20a4af;}
.brand-title{font-size:15px;font-weight:700;color:#e6e8eb;letter-spacing:.03em;}
.brand-sub{font-size:10px;color:#5f6975;text-transform:uppercase;letter-spacing:.1em;}
.spacer{flex:1;}
.pill{
  font-size:11px;font-family:monospace;padding:3px 10px;border-radius:999px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  color:#9aa5b1;
}
.pill.ok {color:#4ea76b;border-color:rgba(78,167,107,0.4);}
.pill.bad{color:#c64f4f;border-color:rgba(198,79,79,0.4);}
.pill.warn{color:#d4a017;border-color:rgba(212,160,23,0.4);}
.ghost{
  font-size:12px;color:#9aa5b1;border:1px solid rgba(255,255,255,0.1);
  padding:5px 12px;border-radius:4px;background:rgba(255,255,255,0.04);
  transition:color .15s,border-color .15s;
}
.ghost:hover{color:#e6e8eb;border-color:rgba(255,255,255,0.25);}

/* ── Left timeline ────────────────────────────────────────────────────────── */
#left-axis{
  position:fixed;left:20px;top:80px;bottom:100px;z-index:5;
  display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;
}
.axis-label{
  font-size:10px;color:rgba(95,105,117,0.7);font-family:monospace;
  display:flex;align-items:center;gap:6px;
}
.axis-dot{width:5px;height:5px;border-radius:50%;background:rgba(32,164,175,0.4);}
.axis-line{
  position:fixed;left:23px;top:80px;bottom:100px;width:1px;z-index:4;
  background:linear-gradient(to bottom,transparent,rgba(32,164,175,0.2) 20%,rgba(32,164,175,0.2) 80%,transparent);
  pointer-events:none;
}

/* ── Bottom stats bar ─────────────────────────────────────────────────────── */
#bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:stretch;gap:0;
  background:rgba(8,12,20,0.85);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(32,164,175,0.2);
  height:80px;
}
.stat-cell{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 24px;border-right:1px solid rgba(255,255,255,0.06);
}
.stat-cell:last-child{border-right:0;}
.stat-label{font-size:10px;color:#5f6975;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:700;font-family:monospace;line-height:1;display:flex;align-items:baseline;gap:6px;}
.stat-value .unit{font-size:12px;font-weight:400;color:#9aa5b1;}
.stat-value .trend{font-size:11px;}
.verdict-badge{
  font-size:13px;font-weight:700;font-family:monospace;
  padding:3px 10px;border-radius:4px;letter-spacing:.05em;
}
.verdict-badge.go  {background:rgba(78,167,107,.15);color:#4ea76b;border:1px solid rgba(78,167,107,.35);}
.verdict-badge.cond{background:rgba(212,160,23,.15);color:#d4a017;border:1px solid rgba(212,160,23,.35);}
.verdict-badge.nogo{background:rgba(198,79,79,.15);color:#c64f4f;border:1px solid rgba(198,79,79,.35);}
.verdict-badge.none{background:rgba(255,255,255,.05);color:#5f6975;border:1px solid rgba(255,255,255,.08);}

/* ── Right detail panel ───────────────────────────────────────────────────── */
#detail-panel{
  position:fixed;right:0;top:50px;bottom:80px;z-index:8;
  width:320px;
  background:rgba(8,12,22,0.88);
  backdrop-filter:blur(16px);
  border-left:1px solid rgba(32,164,175,0.25);
  padding:20px 18px;
  overflow-y:auto;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#detail-panel.open{transform:translateX(0);}
.dp-close{
  position:absolute;top:12px;right:12px;
  color:#5f6975;font-size:18px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
}
.dp-close:hover{color:#e6e8eb;border-color:rgba(255,255,255,0.2);}
.dp-title{font-size:11px;color:#5f6975;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px;}
.dp-name{font-size:18px;font-weight:700;margin-bottom:16px;line-height:1.2;}
.dp-section{margin-bottom:20px;}
.dp-section h4{font-size:10px;color:#5f6975;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:6px;}
.dp-kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;}
.dp-kv dt{color:#9aa5b1;}
.dp-kv dd{font-family:monospace;}
.dp-bar-wrap{height:6px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;margin-top:3px;}
.dp-bar-fill{height:100%;border-radius:99px;}
.dp-analysis{
  font-size:12px;line-height:1.6;color:#9aa5b1;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
  border-radius:6px;padding:10px 12px;margin-top:8px;
}
.dp-analysis strong{color:#d4a017;font-size:11px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
.dp-tag{
  display:inline-block;font-size:10px;font-family:monospace;
  padding:2px 7px;border-radius:99px;margin:2px 2px 0 0;
  background:rgba(32,164,175,0.1);border:1px solid rgba(32,164,175,0.25);color:#20a4af;
}
.dp-tag.stub{background:rgba(212,160,23,0.1);border-color:rgba(212,160,23,.25);color:#d4a017;}
.dp-tag.fail{background:rgba(198,79,79,0.1);border-color:rgba(198,79,79,.25);color:#c64f4f;}

/* ── Scrollbar ────────────────────────────────────────────────────────────── */
*::-webkit-scrollbar{width:6px;height:6px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}

/* ── SVG glow filters / node styles ─────────────────────────────────────────*/
.node-core circle.orb{fill:url(#grad-core);filter:url(#glow-gold);}
.node-domain circle.orb{filter:url(#glow-domain);}
.node-module circle.orb{filter:url(#glow-module);}
.node-label{fill:#e6e8eb;font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;text-anchor:middle;pointer-events:none;}
.node-sub{fill:#9aa5b1;font-family:'Segoe UI',system-ui,sans-serif;font-size:9px;text-anchor:middle;pointer-events:none;}
.node-score{font-family:monospace;font-size:10px;text-anchor:middle;pointer-events:none;}
.beam{stroke-width:1.2;fill:none;opacity:.55;}
.beam-module{stroke-width:.7;fill:none;opacity:.35;}

@keyframes pulse-core{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}
@keyframes pulse-domain{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#core-group{animation:pulse-core 4s ease-in-out infinite;transform-origin:700px 400px;}
</style>
</head>
<body>

<!-- ── Particle canvas ───────────────────────────────────────────────────── -->
<div id="bg"><canvas id="stars"></canvas></div>

<!-- ── Universe graph ────────────────────────────────────────────────────── -->
<svg id="universe" viewBox="0 0 1400 840" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Core orb gradient: gold/amber -->
    <radialGradient id="grad-core" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe580"/>
      <stop offset="45%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a4d00"/>
    </radialGradient>
    <!-- Glow filters -->
    <filter id="glow-gold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-domain" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-module" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Beam gradients (core → domain) -->
    <linearGradient id="beam-corpus"   x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" x1="700" y1="400" x2="300" y2="160"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#4ea76b"/></linearGradient>
    <linearGradient id="beam-healing"  x1="700" y1="400" x2="1000" y2="170" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#4ea76b"/></linearGradient>
    <linearGradient id="beam-loop"     x1="700" y1="400" x2="1060" y2="600" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#20a4af"/></linearGradient>
    <linearGradient id="beam-meta"     x1="700" y1="400" x2="300" y2="620" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#20a4af"/></linearGradient>
    <linearGradient id="beam-vll"      x1="700" y1="400" x2="700" y2="130" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#6b7fff"/></linearGradient>
    <linearGradient id="beam-council"  x1="700" y1="400" x2="700" y2="700" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#a076d4"/></linearGradient>
  </defs>

  <!-- ── Beam lines (core → domains) ───────────────────────── -->
  <line class="beam" id="beam-l-corpus"  x1="700" y1="400" x2="300" y2="160" stroke="url(#beam-corpus)"/>
  <line class="beam" id="beam-l-healing" x1="700" y1="400" x2="1000" y2="170" stroke="url(#beam-healing)"/>
  <line class="beam" id="beam-l-loop"    x1="700" y1="400" x2="1060" y2="600" stroke="url(#beam-loop)"/>
  <line class="beam" id="beam-l-meta"    x1="700" y1="400" x2="300" y2="620" stroke="url(#beam-meta)"/>
  <line class="beam" id="beam-l-vll"     x1="700" y1="400" x2="700" y2="130" stroke="url(#beam-vll)"/>
  <line class="beam" id="beam-l-council" x1="700" y1="400" x2="700" y2="710" stroke="url(#beam-council)"/>

  <!-- ── Module beams (domain → module) ────────────────────── -->
  <!-- corpus children -->
  <line class="beam-module" x1="300" y1="160" x2="120" y2="70"  stroke="#4ea76b"/>
  <line class="beam-module" x1="300" y1="160" x2="110" y2="220" stroke="#4ea76b"/>
  <line class="beam-module" x1="300" y1="160" x2="200" y2="300" stroke="#4ea76b"/>
  <!-- healing children -->
  <line class="beam-module" x1="1000" y1="170" x2="1130" y2="70"  stroke="#4ea76b"/>
  <line class="beam-module" x1="1000" y1="170" x2="1180" y2="200" stroke="#4ea76b"/>
  <!-- loop children -->
  <line class="beam-module" x1="1060" y1="600" x2="1200" y2="520" stroke="#20a4af"/>
  <line class="beam-module" x1="1060" y1="600" x2="1200" y2="670" stroke="#20a4af"/>
  <!-- meta children -->
  <line class="beam-module" x1="300" y1="620" x2="130" y2="540" stroke="#20a4af"/>
  <line class="beam-module" x1="300" y1="620" x2="140" y2="700" stroke="#20a4af"/>

  <!-- ── WALCHE CORE (MetaEngine / Bertha) ─────────────────── -->
  <g id="core-group" class="node-group node-core" data-node="core" tabindex="0">
    <!-- Outer ring pulse -->
    <circle cx="700" cy="400" r="90" fill="none" stroke="rgba(212,160,23,0.12)" stroke-width="40"/>
    <circle cx="700" cy="400" r="72" fill="none" stroke="rgba(212,160,23,0.18)" stroke-width="12"/>
    <!-- Main orb -->
    <circle class="orb" cx="700" cy="400" r="58"/>
    <!-- Ring texture (simplified corona) -->
    <circle cx="700" cy="400" r="64" fill="none" stroke="rgba(255,229,128,0.25)" stroke-width="3" stroke-dasharray="4 6"/>
    <!-- Label -->
    <text class="node-label" x="700" y="478" font-size="13" font-weight="700" fill="#e6e8eb">WALCHE CORE</text>
    <text class="node-sub" x="700" y="493" fill="#9aa5b1">MetaEngine · Bertha</text>
    <text id="core-score" class="node-score" x="700" y="400" dy="4" fill="#ffe580" font-size="13" font-weight="700">—</text>
  </g>

  <!-- ── corpus.integrity domain ───────────────────────────── -->
  <g class="node-group node-domain" data-node="corpus" tabindex="0">
    <circle class="orb" id="orb-corpus"  cx="300" cy="160" r="36" fill="#4ea76b"/>
    <circle cx="300" cy="160" r="44" fill="none" stroke="rgba(78,167,107,0.2)" stroke-width="8"/>
    <text class="node-label" x="300" y="212" fill="#e6e8eb">corpus.integrity</text>
    <text id="score-corpus" class="node-score" x="300" y="162" dy="3" fill="#fff"/>
    <!-- GAPS badge -->
    <rect id="gap-corpus" x="252" y="174" width="96" height="16" rx="8" fill="rgba(0,0,0,0.5)"/>
    <text id="gaplabel-corpus" x="300" y="186" text-anchor="middle" font-size="9" font-family="monospace" fill="#9aa5b1">GAPS —</text>
  </g>

  <!-- ── healing.engine domain ─────────────────────────────── -->
  <g class="node-group node-domain" data-node="healing" tabindex="0">
    <circle class="orb" id="orb-healing" cx="1000" cy="170" r="30" fill="#4ea76b"/>
    <circle cx="1000" cy="170" r="38" fill="none" stroke="rgba(78,167,107,0.2)" stroke-width="8"/>
    <text class="node-label" x="1000" y="216" fill="#e6e8eb">healing.engine</text>
    <text id="score-healing" class="node-score" x="1000" y="172" dy="3" fill="#fff"/>
  </g>

  <!-- ── loop.registry domain ──────────────────────────────── -->
  <g class="node-group node-domain" data-node="loop" tabindex="0">
    <circle class="orb" id="orb-loop" cx="1060" cy="600" r="30" fill="#20a4af"/>
    <circle cx="1060" cy="600" r="38" fill="none" stroke="rgba(32,164,175,0.2)" stroke-width="8"/>
    <text class="node-label" x="1060" y="646" fill="#e6e8eb">loop.registry</text>
    <text id="score-loop" class="node-score" x="1060" y="602" dy="3" fill="#fff"/>
  </g>

  <!-- ── meta.engine domain ────────────────────────────────── -->
  <g class="node-group node-domain" data-node="meta" tabindex="0">
    <circle class="orb" id="orb-meta" cx="300" cy="620" r="30" fill="#20a4af"/>
    <circle cx="300" cy="620" r="38" fill="none" stroke="rgba(32,164,175,0.2)" stroke-width="8"/>
    <text class="node-label" x="300" y="666" fill="#e6e8eb">meta.engine</text>
    <text id="score-meta" class="node-score" x="300" y="622" dy="3" fill="#fff"/>
  </g>

  <!-- ── VLL node ───────────────────────────────────────────── -->
  <g class="node-group node-domain" data-node="vll" tabindex="0">
    <circle class="orb" cx="700" cy="130" r="26" fill="#6b7fff"/>
    <circle cx="700" cy="130" r="34" fill="none" stroke="rgba(107,127,255,0.2)" stroke-width="8"/>
    <text class="node-label" x="700" y="172" fill="#e6e8eb">VLL</text>
    <text class="node-sub" x="700" y="184" fill="#9aa5b1">Verification Learning</text>
    <text id="score-vll" class="node-score" x="700" y="132" dy="3" fill="#c8caff"/>
  </g>

  <!-- ── Grand Council node ─────────────────────────────────── -->
  <g class="node-group node-domain" data-node="council" tabindex="0">
    <circle class="orb" cx="700" cy="710" r="26" fill="#a076d4"/>
    <circle cx="700" cy="710" r="34" fill="none" stroke="rgba(160,118,212,0.2)" stroke-width="8"/>
    <text class="node-label" x="700" y="752" fill="#e6e8eb">Grand Council</text>
    <text class="node-sub" x="700" y="764" fill="#9aa5b1">47 judges</text>
    <text id="score-council" class="node-score" x="700" y="712" dy="3" fill="#d4b8ff"/>
  </g>

  <!-- ── Module leaf nodes ─────────────────────────────────── -->
  <!-- corpus cluster -->
  <g class="node-group node-module" data-node="mod-rubric" tabindex="0">
    <circle id="orb-rubric"   cx="120" cy="70"  r="14" fill="#20a4af" class="orb"/>
    <text class="node-label"  x="120" y="92"  fill="#9aa5b1" font-size="9">RubricScorer</text>
  </g>
  <g class="node-group node-module" data-node="mod-preingest" tabindex="0">
    <circle id="orb-preingest" cx="110" cy="220" r="14" fill="#20a4af" class="orb"/>
    <text class="node-label"  x="110" y="242" fill="#9aa5b1" font-size="9">PreIngestGate</text>
  </g>
  <g class="node-group node-module" data-node="mod-config" tabindex="0">
    <circle id="orb-config"   cx="200" cy="310" r="12" fill="#20a4af" class="orb"/>
    <text class="node-label"  x="200" y="330" fill="#9aa5b1" font-size="9">WalcheConfig</text>
  </g>
  <!-- healing cluster -->
  <g class="node-group node-module" data-node="mod-heal" tabindex="0">
    <circle id="orb-heal"   cx="1130" cy="70"  r="14" fill="#20a4af" class="orb"/>
    <text class="node-label" x="1130" y="92"  fill="#9aa5b1" font-size="9">HealingEngine</text>
  </g>
  <g class="node-group node-module" data-node="mod-pain" tabindex="0">
    <circle id="orb-pain"   cx="1180" cy="200" r="14" fill="#20a4af" class="orb"/>
    <text class="node-label" x="1180" y="222" fill="#9aa5b1" font-size="9">PAIN-FMEA</text>
  </g>
  <!-- loop cluster -->
  <g class="node-group node-module" data-node="mod-guard" tabindex="0">
    <circle id="orb-guard"  cx="1200" cy="520" r="13" fill="#20a4af" class="orb"/>
    <text class="node-label" x="1200" y="542" fill="#9aa5b1" font-size="9">GuardRail</text>
  </g>
  <g class="node-group node-module" data-node="mod-prov" tabindex="0">
    <circle id="orb-prov"   cx="1200" cy="670" r="12" fill="#20a4af" class="orb"/>
    <text class="node-label" x="1200" y="690" fill="#9aa5b1" font-size="9">Provenance</text>
  </g>
  <!-- meta cluster -->
  <g class="node-group node-module" data-node="mod-cross" tabindex="0">
    <circle id="orb-cross"  cx="130" cy="540" r="13" fill="#20a4af" class="orb"/>
    <text class="node-label" x="130" y="562" fill="#9aa5b1" font-size="9">CrossEnsemble</text>
  </g>
  <g class="node-group node-module" data-node="mod-c12" tabindex="0">
    <circle id="orb-c12"    cx="140" cy="700" r="12" fill="#20a4af" class="orb"/>
    <text class="node-label" x="140" y="720" fill="#9aa5b1" font-size="9">C12 Gate</text>
  </g>
</svg>

<!-- ── Top bar ────────────────────────────────────────────── -->
<div id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l4 9 5-7 5 7 4-9"/>
      <rect x="1" y="1" width="22" height="22" rx="3"/>
    </svg>
    <div>
      <div class="brand-title">WALCHE</div>
      <div class="brand-sub">Forensic Looping Corpus Brain · EPM-STARK</div>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="api-pill">connecting…</span>
  <span class="pill" id="refresh-pill"></span>
  <button class="ghost" id="btn-refresh">↺ Refresh</button>
</div>

<!-- ── Left timeline (session history) ───────────────────── -->
<div class="axis-line"></div>
<div id="left-axis"></div>

<!-- ── Right detail panel ────────────────────────────────── -->
<div id="detail-panel">
  <button class="dp-close" id="dp-close">✕</button>
  <div id="dp-content"></div>
</div>

<!-- ── Bottom stats bar ──────────────────────────────────── -->
<div id="bottom-bar">
  <div class="stat-cell">
    <div class="stat-label">Final Score</div>
    <div class="stat-value">
      <span id="stat-score">—</span>
      <span class="trend" id="stat-delta"></span>
    </div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Verdict</div>
    <div class="stat-value"><span id="stat-verdict" class="verdict-badge none">—</span></div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Modules (real / stub)</div>
    <div class="stat-value"><span id="stat-modules">— / —</span></div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Corpus Entries</div>
    <div class="stat-value"><span id="stat-corpus">—</span></div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Baseline</div>
    <div class="stat-value"><span id="stat-baseline" style="color:#d4a017">0.9133</span></div>
  </div>
  <div class="stat-cell" style="flex:0;padding:0 16px;">
    <div class="stat-label">Last Run</div>
    <div class="stat-value" style="font-size:12px;"><span id="stat-ts" style="color:#9aa5b1;font-family:monospace;">—</span></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const BASELINE = 0.9133, PASS = 0.85, WARN = 0.70;
  const REFRESH_SECS = 30;

  // ── Particle starfield ───────────────────────────────────────────────────
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function initStars() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 200}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      o: Math.random() * 0.5 + 0.1,
      speed: Math.random() * 0.3 + 0.05,
    }));
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Deep space radial gradient background
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height*0.4, 0, canvas.width/2, canvas.height*0.4, canvas.width * 0.8);
    grad.addColorStop(0,   'rgba(20,60,100,0.15)');
    grad.addColorStop(0.5, 'rgba(8,12,24,0.08)');
    grad.addColorStop(1,   'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${s.o})`;
      ctx.fill();
      // Slow drift
      s.y -= s.speed;
      if (s.y < -2) { s.y = canvas.height + 2; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', initStars);
  initStars();
  drawStars();

  // ── Helpers ──────────────────────────────────────────────────────────────
  function scoreColor(v) {
    return v >= PASS ? '#4ea76b' : v >= WARN ? '#d4a017' : '#c64f4f';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function timeAgo(ts) {
    if (!ts) return '';
    try {
      const diff = Math.floor((Date.now() - new Date(ts.endsWith('Z') ? ts : ts + 'Z').getTime()) / 1000);
      if (diff < 0 || isNaN(diff)) return '';
      if (diff < 60)    return diff + 's ago';
      if (diff < 3600)  return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      return Math.floor(diff/86400) + 'd ago';
    } catch { return ''; }
  }

  // ── Node color update ─────────────────────────────────────────────────────
  function setNodeColor(orbId, color, score) {
    const orb = document.getElementById(orbId);
    if (!orb) return;
    orb.setAttribute('fill', color);
    orb.style.filter = `drop-shadow(0 0 ${score >= PASS ? 12 : 6}px ${color}88)`;
  }

  function updateDomainNode(nodeId, score) {
    const color = scoreColor(score);
    const orbEl = document.getElementById('orb-' + nodeId);
    const scoreEl = document.getElementById('score-' + nodeId);
    if (orbEl) {
      orbEl.setAttribute('fill', color);
      orbEl.setAttribute('stroke', color + '44');
    }
    if (scoreEl) {
      scoreEl.textContent = score.toFixed(3);
      scoreEl.setAttribute('fill', '#fff');
    }
    // Update beam color
    const beam = document.getElementById('beam-l-' + nodeId);
    if (beam) beam.setAttribute('stroke', color + 'bb');
  }

  // ── Module status update ──────────────────────────────────────────────────
  const MODULE_ORBS = ['rubric','preingest','config','heal','pain','guard','prov','cross','c12'];
  function updateModules(realCount, stubCount) {
    MODULE_ORBS.forEach((id, i) => {
      const el = document.getElementById('orb-' + id);
      if (!el) return;
      const isReal = i < realCount;
      const color  = isReal ? '#20a4af' : '#d4a017';
      el.setAttribute('fill', color);
    });
  }

  // ── Bottom bar ───────────────────────────────────────────────────────────
  function updateBottomBar(data) {
    const lr = data.last_run;
    const kb = data.corpus_kb_stats;

    if (lr) {
      const fs    = parseFloat(lr.final_score || 0);
      const delta = parseFloat(lr.delta || 0);
      const v     = lr.verdict || '';

      const scoreEl = document.getElementById('stat-score');
      scoreEl.textContent = fs.toFixed(3);
      scoreEl.style.color = scoreColor(fs);

      const deltaEl = document.getElementById('stat-delta');
      deltaEl.textContent = (delta >= 0 ? '+' : '') + delta.toFixed(3);
      deltaEl.style.color = delta >= 0 ? '#4ea76b' : '#c64f4f';

      const vEl = document.getElementById('stat-verdict');
      vEl.textContent = v || '—';
      vEl.className   = 'verdict-badge ' + (v === 'GO' ? 'go' : v === 'GO-WITH-CONDITIONS' ? 'cond' : v === 'NO-GO' ? 'nogo' : 'none');

      document.getElementById('stat-modules').textContent = (lr.real_modules || 0) + ' / ' + (lr.stub_modules || 0);
      document.getElementById('stat-modules').style.color = (lr.stub_modules || 0) > 0 ? '#d4a017' : '#4ea76b';

      const ts = (lr.timestamp || '').slice(0, 16).replace('T', ' ');
      document.getElementById('stat-ts').textContent = ts + (timeAgo(lr.timestamp) ? '  (' + timeAgo(lr.timestamp) + ')' : '');

      // Update core score
      document.getElementById('core-score').textContent = fs.toFixed(3);
      document.getElementById('core-score').setAttribute('fill', scoreColor(fs));

      // Update corpus GAPS badge
      const gap = BASELINE - fs;
      const gapEl = document.getElementById('gaplabel-corpus');
      if (gapEl) {
        gapEl.textContent = gap > 0 ? 'GAP ' + gap.toFixed(3) : 'ABOVE BASELINE';
        gapEl.setAttribute('fill', gap > 0 ? '#d4a017' : '#4ea76b');
      }

      updateModules(lr.real_modules || 0, lr.stub_modules || 0);
    }

    if (kb) {
      const n = kb.total_entries_in_kb || kb.entries_passed || 0;
      document.getElementById('stat-corpus').textContent = n.toLocaleString();
    } else {
      document.getElementById('stat-corpus').textContent = 'No KB';
      document.getElementById('stat-corpus').style.color = '#5f6975';
    }
  }

  // ── Domain nodes ─────────────────────────────────────────────────────────
  function updateDomainNodes(lr) {
    if (!lr || !lr.domain_results || !lr.domain_results.length) return;
    const last = lr.domain_results[lr.domain_results.length - 1];
    if (!Array.isArray(last)) return;
    last.forEach(entry => {
      if (!entry || !entry.domain) return;
      const s = parseFloat(entry.score || 0);
      const key = entry.domain.split('.')[0]; // corpus, healing, loop, meta
      updateDomainNode(key, s);
    });
  }

  // ── VLL node ─────────────────────────────────────────────────────────────
  function updateVllNode(vll) {
    const el = document.getElementById('score-vll');
    if (!el) return;
    if (vll && vll.proposals_processed != null) {
      el.textContent = vll.proposals_processed + ' prop.';
    }
  }

  // ── Council node ─────────────────────────────────────────────────────────
  function updateCouncilNode(decisions) {
    const el = document.getElementById('score-council');
    if (!el) return;
    el.textContent = (decisions && decisions.length) ? decisions.length + ' decisions' : 'no decisions';
  }

  // ── Left timeline (session history) ──────────────────────────────────────
  function updateTimeline(scores) {
    const axis = document.getElementById('left-axis');
    if (!scores || scores.length === 0) {
      axis.innerHTML = '<div class="axis-label"><div class="axis-dot"></div>No history</div>';
      return;
    }
    axis.innerHTML = scores.slice().reverse().map((s, i) =>
      `<div class="axis-label">
        <div class="axis-dot" style="background:${scoreColor(s)};"></div>
        <span>S${scores.length - i}</span>
        <span style="color:${scoreColor(s)};font-family:monospace;">${s.toFixed(3)}</span>
      </div>`
    ).join('');
  }

  // ── Detail panel ─────────────────────────────────────────────────────────
  let currentData = null;

  const nodeInfo = {
    core: { title: 'WALCHE CORE', sub: 'MetaEngine / Bertha — central evaluator' },
    corpus:  { title: 'corpus.integrity', sub: 'CEVIP pipeline score · primary health metric' },
    healing: { title: 'healing.engine',   sub: 'Self-repair proposal generator' },
    loop:    { title: 'loop.registry',    sub: 'ReAct-class loop orchestrator' },
    meta:    { title: 'meta.engine',      sub: 'Bertha meta-evaluator (C12 judge)' },
    vll:     { title: 'VLL',              sub: 'Verification Learning Loop — bounded RSI' },
    council: { title: 'Grand Council',    sub: '47-judge governance deliberation system' },
    'mod-rubric':    { title: 'RubricScorer',    sub: '7-dimension corpus scoring engine' },
    'mod-preingest': { title: 'PreIngestGate',   sub: 'CEVIP phase 1 — intake validation' },
    'mod-config':    { title: 'WalcheConfig',    sub: 'Root configuration loader' },
    'mod-heal':      { title: 'HealingEngine',   sub: 'Diagnose → propose → apply loop' },
    'mod-pain':      { title: 'PAIN-FMEA',       sub: 'Adversarial failure mode analysis' },
    'mod-guard':     { title: 'GuardRail',        sub: 'Safety constraint propagation layer' },
    'mod-prov':      { title: 'Provenance',       sub: 'SHA-256 lineage tracking chain' },
    'mod-cross':     { title: 'CrossEnsemble',    sub: 'PAIN + SAGE + ORACLE tri-perspective gate' },
    'mod-c12':       { title: 'C12 Gate',         sub: 'Binary rubric_ok + risk_ok verdict' },
  };

  function openDetailPanel(nodeId) {
    const panel = document.getElementById('detail-panel');
    const info  = nodeInfo[nodeId] || { title: nodeId, sub: '' };
    const data  = currentData;

    let html = `<div class="dp-title">${esc(nodeId.startsWith('mod-') ? 'Module' : 'Domain')}</div>
      <div class="dp-name">${esc(info.title)}</div>`;

    if (nodeId === 'core' && data && data.last_run) {
      const lr = data.last_run;
      const fs = parseFloat(lr.final_score || 0);
      html += `<div class="dp-section"><h4>Last Run</h4>
        <dl class="dp-kv">
          <dt>Score</dt><dd style="color:${scoreColor(fs)}">${fs.toFixed(4)}</dd>
          <dt>Verdict</dt><dd style="color:${scoreColor(fs)}">${esc(lr.verdict || '—')}</dd>
          <dt>Delta</dt><dd style="color:${parseFloat(lr.delta||0)>=0?'#4ea76b':'#c64f4f'}">${(parseFloat(lr.delta||0)>=0?'+':'')}${parseFloat(lr.delta||0).toFixed(4)}</dd>
          <dt>Real modules</dt><dd>${lr.real_modules || 0}</dd>
          <dt>Stub modules</dt><dd style="color:${(lr.stub_modules||0)>0?'#d4a017':'#4ea76b'}">${lr.stub_modules || 0}</dd>
        </dl>
        ${(lr.cycle_scores||[]).length>0?`<div style="margin-top:10px;font-size:11px;color:#9aa5b1;">Cycles: ${lr.cycle_scores.map((s,i)=>`<span style="color:${scoreColor(parseFloat(s))}">${i+1}: ${parseFloat(s).toFixed(3)}</span>`).join(' → ')}</div>`:''}
      </div>`;
    }

    // Domain detail
    if (['corpus','healing','loop','meta'].includes(nodeId) && data && data.last_run) {
      const lr = data.last_run;
      const last = (lr.domain_results || []).slice(-1)[0] || [];
      const entry = (Array.isArray(last) ? last : []).find(e => e && e.domain && e.domain.startsWith(nodeId));
      if (entry) {
        const s  = parseFloat(entry.score || 0);
        const db = s - BASELINE;
        html += `<div class="dp-section"><h4>Domain Score</h4>
          <dl class="dp-kv">
            <dt>Score</dt><dd style="color:${scoreColor(s)}">${s.toFixed(4)}</dd>
            <dt>vs Baseline</dt><dd style="color:${db>=0?'#4ea76b':'#c64f4f'}">${db>=0?'+':''}${db.toFixed(4)}</dd>
            <dt>Status</dt><dd style="color:${scoreColor(s)}">${s>=PASS?'PASS':s>=WARN?'WARN':'FAIL'}</dd>
          </dl>
          <div class="dp-bar-wrap" style="margin-top:10px;">
            <div class="dp-bar-fill" style="width:${Math.round(s*100)}%;background:${scoreColor(s)};"></div>
          </div>
        </div>`;
      }
    }

    // VLL detail
    if (nodeId === 'vll' && data && data.vll_state) {
      const vll = data.vll_state;
      const adj  = vll.adjusted_weights || {};
      const base = vll.baseline_weights || {};
      html += `<div class="dp-section"><h4>VLL State</h4>
        <dl class="dp-kv">
          <dt>Proposals</dt><dd>${vll.proposals_processed || 0}</dd>
          <dt>Last updated</dt><dd>${(vll.last_updated || '—').slice(0,10)}</dd>
          <dt>Learning rate</dt><dd>0.03</dd>
          <dt>Weight bounds</dt><dd>0.60 – 1.40</dd>
        </dl>
      </div>`;
      const dims = Object.keys({...base,...adj});
      if (dims.length) {
        html += `<div class="dp-section"><h4>Weight Adjustments</h4>`;
        dims.forEach(d => {
          const bv = parseFloat(base[d]||1); const av = parseFloat(adj[d]||bv);
          const diff = av - bv;
          html += `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
            <span style="color:#9aa5b1;font-family:monospace">${esc(d)}</span>
            <span style="color:${diff>=0?'#4ea76b':'#c64f4f'};font-family:monospace">${diff>=0?'+':''}${diff.toFixed(4)}</span>
          </div>`;
        });
        html += '</div>';
      }
    }

    // Council detail
    if (nodeId === 'council' && data && data.council_decisions) {
      const decisions = data.council_decisions.slice(-5).reverse();
      html += `<div class="dp-section"><h4>Recent Decisions (${data.council_decisions.length} total)</h4>`;
      if (decisions.length === 0) {
        html += '<div style="color:#5f6975;font-size:12px;">No decisions yet.</div>';
      }
      decisions.forEach(d => {
        const v = d.verdict || d.final_verdict || '?';
        const isOk = /APPROVE|^GO$/i.test(v);
        const color = isOk ? '#4ea76b' : /CONDITION/i.test(v) ? '#d4a017' : '#c64f4f';
        html += `<div style="margin-bottom:8px;padding:8px;background:rgba(255,255,255,0.03);border-radius:4px;border-left:3px solid ${color}">
          <div style="display:flex;justify-content:space-between;font-size:11px;">
            <span style="font-family:monospace;color:#e6e8eb">${esc(d.proposal_type||d.type||'?')}</span>
            <span style="color:${color};font-family:monospace;font-weight:700">${esc(v)}</span>
          </div>
          <div style="font-size:10px;color:#5f6975;font-family:monospace;margin-top:3px">${(d.timestamp||'').slice(0,16)}</div>
          ${d.summary?`<div style="font-size:11px;color:#9aa5b1;margin-top:4px">${esc(d.summary)}</div>`:''}
        </div>`;
      });
      html += '</div>';
    }

    // Corpus detail
    if (nodeId === 'corpus' && data && data.corpus_kb_stats) {
      const kb = data.corpus_kb_stats;
      const intg = parseFloat(kb.predicted_integrity_score || 0);
      html += `<div class="dp-section"><h4>Knowledge Base</h4>
        <dl class="dp-kv">
          <dt>Entries</dt><dd>${(kb.total_entries_in_kb||kb.entries_passed||0).toLocaleString()}</dd>
          <dt>Tokens</dt><dd>${(kb.total_tokens||0).toLocaleString()}</dd>
          <dt>Integrity</dt><dd style="color:${scoreColor(intg)}">${intg.toFixed(4)}</dd>
          <dt>Generated</dt><dd>${(kb.generated_at||'—').slice(0,10)}</dd>
        </dl>
      </div>`;
      const gap = PASS - intg;
      if (gap > 0) {
        html += `<div class="dp-analysis">
          <strong>⚠ VLL Cross Gate locked</strong>
          corpus.integrity ${intg.toFixed(3)} is ${gap.toFixed(3)} below PASS threshold (0.85).<br>
          Priority action: OSMODA corpus ingest → expected to push 0.78→0.87–0.92.
        </div>`;
      } else {
        html += `<div class="dp-analysis" style="border-color:rgba(78,167,107,0.3)"><strong style="color:#4ea76b">✓ VLL Cross Gate unlocked</strong>corpus.integrity meets PASS threshold.</div>`;
      }
    }

    // Analysis section (RI-style)
    html += `<div class="dp-section"><h4>Analysis</h4>
      <div class="dp-analysis">
        <strong>Architecture Note</strong>
        ${esc(info.sub)}<br>
        WALCHE classification: ReAct-class (Yao et al. 2022 arXiv:2210.03629) · Type 2–3 NeSy (Kautz 2022) · Bounded RSI (VLL + 4-cycle cap + C12 guard).
      </div>
    </div>`;

    document.getElementById('dp-content').innerHTML = html;
    panel.classList.add('open');
  }

  document.getElementById('dp-close').addEventListener('click', () => {
    document.getElementById('detail-panel').classList.remove('open');
  });

  // Wire node clicks
  document.querySelectorAll('.node-group').forEach(g => {
    g.addEventListener('click', () => openDetailPanel(g.dataset.node));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openDetailPanel(g.dataset.node); });
  });

  // ── API + render ─────────────────────────────────────────────────────────
  async function fetchAndRender() {
    const pill = document.getElementById('api-pill');
    pill.textContent = 'loading…';
    pill.className = 'pill';
    try {
      const r = await fetch('/api/status');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      currentData = data;
      pill.textContent = 'live';
      pill.className = 'pill ok';
      updateBottomBar(data);
      updateDomainNodes(data.last_run);
      updateVllNode(data.vll_state);
      updateCouncilNode(data.council_decisions);
      updateTimeline(data.score_trend || []);
    } catch (err) {
      pill.textContent = 'server offline';
      pill.className = 'pill bad';
      document.getElementById('stat-score').textContent = '—';
      document.getElementById('stat-score').style.color = '#5f6975';
    }
  }

  // ── Countdown + auto-refresh ──────────────────────────────────────────────
  let countdown = REFRESH_SECS;
  setInterval(() => {
    countdown -= 1;
    if (countdown <= 0) { countdown = REFRESH_SECS; fetchAndRender(); }
    document.getElementById('refresh-pill').textContent = 'refresh in ' + countdown + 's';
  }, 1000);

  document.getElementById('btn-refresh').addEventListener('click', () => {
    countdown = REFRESH_SECS;
    fetchAndRender();
  });

  fetchAndRender();
})();
</script>
</body>
</html>
